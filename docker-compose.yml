services:
  backend:
    build:
      context: ./backend
    container_name: windscope-backend
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: windscope-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped